[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-benchmark"
version = "0.1.0"
description = "Shared evaluation pipeline for native agent memory baselines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=15,<26", "tiktoken>=0.12,<1"]
api = ["httpx>=0.27,<1", "openai>=1.59,<3", "tiktoken>=0.12,<1"]

[project.scripts]
memory-benchmark = "memory_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
